[project]
name = "python2ts"
version = "v0.6.1"
authors = [{ name = "Sebastian B. Mohr", email = "sebastian@mohrenclan.de" }]
description = "Convert python typehints to typescript interfaces"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  # Maturety of the project
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  # Specify the Python versions we support.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  # Specify the license
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
]
dependencies = ["typing-extensions"]

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "docs" },
  { include-group = "typed" },
  "pre-commit>=4.5.1",
]
test = ["pytest>=9.0.2", "pytest-cov>=7.0.0"]
lint = ["ruff>=0.16.4"]
docs = [
  "sphinx>=8.0.2",
  "furo>=2024.8.6",
  "sphinx-copybutton>=0.5.2",
  "sphinx-inline-tabs>=2023.4.21",
  "sphinxcontrib-typer[html]>=0.5.0",
  "myst-parser>=4.0.0",
  "myst-nb>=1.1.2",
]
typed = ["mypy>=1.19.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/py2ts"]
include = ["src/py2ts/py.typed"]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
future-annotations = true
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "ISC", # flake8-implicit-str-concat
    "N",   # pep8-naming
    "RUF", # ruff
    "UP",  # pyupgrade
    "TC",  # flake8-type-checking
    "PTH", # Use pathlib instead of os.path
    "D",   # pydocstyle
    "W",   # pycodestyle
]
ignore = ["D104", "D100"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "I", "S", "W"]
"**__main__.py" = ["D103"]
"**.ipynb" = ["D", "I", "S", "W"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--cov=."]
filterwarnings = ["error", "ignore::DeprecationWarning"]
pythonpath = ["."]


[tool.coverage.report]
omit = ["*/tests/*"]
exclude_also = ["raise NotImplementedError", "@(abc\\.)?abstractmethod"]
